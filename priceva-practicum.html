<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Формулы репрайсинга — практикум Priceva</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#162842;font:16px/1.55 Inter,Arial,sans-serif}main{max-width:1090px;margin:auto;padding:30px 22px 60px}header{border-bottom:1px solid #dce5f2;padding-bottom:13px;font-weight:800;color:#174ec1}h1{font-size:clamp(34px,6vw,65px);line-height:1.04;letter-spacing:-.045em;margin:32px 0 12px}h2{font-size:25px;margin:0 0 8px}p{margin:0 0 15px}.intro{max-width:730px;color:#465a75}.layout{display:grid;grid-template-columns:310px 1fr;gap:20px;margin-top:28px}article,section{border:1px solid #dce5f2;border-radius:18px;background:white;padding:23px}article{align-self:start}article p,.hint{font-size:14px;color:#48617f}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}button,input,select{font:inherit}button{border:1px solid #c9d9f0;background:#edf4ff;color:#184699;border-radius:9px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#1954cc;color:white;border-color:#1954cc}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #739cff;outline-offset:2px}.inside{display:grid;grid-template-columns:1fr 1fr;gap:14px}fieldset{min-width:0;border:1px solid #dce5f2;border-radius:12px;padding:12px;margin:0}legend{font-weight:700}label{display:block;margin-bottom:8px;font-size:14px}input:not([type=checkbox]),select{width:100%;border:1px solid #b9cce8;border-radius:7px;padding:6px;background:white;color:inherit}.row{display:flex;gap:8px}.row input[type=number]{flex:1;min-width:0}.row label{margin:auto 0;white-space:nowrap}.result{margin-top:16px;background:#eaf2ff;padding:15px;border-radius:12px}.amount{font-size:34px;font-weight:800;display:block}.result p{margin:0}.task{background:#f3f7fd;padding:11px;border-radius:9px}.branch{border-left:3px solid #6ea0ff;padding-left:8px;margin-top:10px}small{color:#48617f}a{color:#174ec1}[hidden]{display:none!important}@media(max-width:760px){.layout{grid-template-columns:1fr}}@media(max-width:510px){.inside{grid-template-columns:1fr}}
.theory{padding:14px 0;border-top:1px solid #dce5f2;scroll-margin-top:18px}.theory:target{background:#edf4ff;box-shadow:0 0 0 8px #edf4ff}.theory h3{margin:0 0 6px;line-height:1.25}.lesson{display:block;margin:6px 0;font-size:14px}section{align-self:start;scroll-margin-top:16px}#offers .row{margin-bottom:8px}
</style>
<style>
.layout{display:block;max-width:940px;margin:auto}.layout article{padding:clamp(16px,4vw,42px)}article p{font-size:16px;color:inherit}article h2{margin-top:32px}article h3{margin:24px 0 8px;scroll-margin-top:18px}article h2:target,article h3:target{background:#eaf2ff}.lesson{display:inline-block;padding:7px 12px;background:#eaf2ff;border-radius:8px;margin:0 4px 12px 0}.table{overflow:auto;margin:12px 0 20px}table{border-collapse:collapse;width:100%}th,td{text-align:left;border:1px solid #dce5f2;padding:8px;vertical-align:top}th{background:#edf4ff}#practice{margin-top:25px}details{margin:10px 0}summary{cursor:pointer;font-weight:650}.checks{display:flex;gap:10px;flex-wrap:wrap}.checks label{margin:0}#trace li{margin:4px 0}output{overflow-wrap:anywhere}
</style>
<main><header>Priceva / Блог</header><div class="layout"><section id="practice" tabindex="-1"><h2>Практикум</h2>
<label>Упражнение<select id="lesson"><option value="offers">Отбор предложений</option><option value="analog">Цены аналогов</option><option value="min">Минимум −1%</option><option value="median">Медиана −1%</option><option value="mean">Средняя −2%</option><option value="rival">Конкурент −50 ₽</option><option value="own">Скидка от фиксированной базы</option><option value="fixed">МВЦ — расходы в рублях</option><option value="rate">МВЦ — процентные расходы</option><option value="margin">МВЦ — целевая доля дохода</option><option value="bounds">Цена в диапазоне</option><option value="cycle">Лимиты за цикл и за период</option><option value="priority">Приоритет стратегии</option><option value="round">Округление до окончания 990</option><option value="full">Сквозной расчёт</option><option value="missing">Нет подходящих предложений</option><option value="index">Индекс цены</option><option value="custom">Своя формула</option></select></label>
<p class="task" id="task"></p><p><a id="back">← К разделу статьи</a></p>
<form id="editor">
<div class="inside"><fieldset id="data"><legend>Исходные данные</legend>
<div id="offers"></div>
<label>Текущая цена, ₽<input id="current" type="number" min="0.01"  step="any" required></label>
<label>Фиксированная базовая цена, ₽<input id="basePrice" type="number" min="0.01"  step="any" required></label>
<label>Цена на начало периода, ₽<input id="periodPrice" type="number" min="0.01"  step="any" required></label>
</fieldset>
<fieldset id="rule"><legend>Ценовое правило</legend>
<label>Ориентир<select id="base"><option value="min">Минимум</option><option value="median">Медиана</option><option value="mean">Среднее</option><option value="a">Конкурент А</option><option value="own">Фиксированная базовая цена</option></select></label>
<label><input type="checkbox" id="fallback"> Использовать конкурента Б, если А недоступен</label>
<label><input type="checkbox" id="priority"> Для этого товара использовать цену конкурента А</label>
<label>Поправка<input id="adjustment" type="number" min="-1000000"  step="any" required></label>
<label>Единица поправки<select id="unit"><option value="percent">%</option><option value="rubles">₽</option></select></label>
<label>МВЦ, ₽<input id="floor" type="number" min="0"  step="any" required></label>
<label>Верхний порог, ₽ (0 — без ограничения)<input id="ceiling" type="number" min="0"  step="any" required></label>
<label>Лимит изменения за цикл, % (0 — без лимита)<input id="cycle" type="number" min="0" max="100" step="any" required></label>
<label>Лимит за период, % (0 — без лимита)<input id="period" type="number" min="0" max="100" step="any" required></label>
<label>Округление<select id="rounding"><option value="none">До копеек</option><option value="nearest">До ближайших 10 ₽</option><option value="down990">Вниз до окончания 990</option></select></label>
<label>Если результат выходит за границы<select id="policy"><option value="clamp">Выбрать допустимую цену</option><option value="review">Передать на проверку</option></select></label>
</fieldset></div>
<fieldset id="economics"><legend>Экономика товара</legend>
<label>Расходы на единицу, ₽<input id="cost" type="number" min="0"  step="any" required></label>
<label>Минимальный доход на единицу, ₽<input id="income" type="number" min="0"  step="any" required></label>
<label>Расходы от цены, %<input id="rate" type="number" min="0" max="100" step="any" required></label>
<label>Целевой доход в доле цены, %<input id="margin" type="number" min="0" max="100" step="any" required></label>
<label>Исходный объём продаж, шт.<input id="volume" type="number" min="1"  step="any" required></label>
</fieldset>
<div class="result" aria-live="polite"><small id="caption">Рекомендованная цена</small><output class="amount" id="amount"></output><ol id="trace"></ol></div>
<p class="hint">Учебный расчёт по примерам статьи.</p></form></section></div></main><script>
const anchors = {"offers":"theory-offers","analog":"theory-analog","min":"theory-min","median":"theory-median","mean":"theory-mean","rival":"theory-rival","own":"theory-own","fixed":"theory-fixed","rate":"theory-rate","margin":"theory-rate","bounds":"theory-bounds","cycle":"theory-cycle","priority":"theory-priority","round":"theory-round","full":"theory-full","missing":"theory-missing","index":"theory-index"};
const labels = {"offers":"Отбор предложений","analog":"Цены аналогов","min":"Минимум −1%","median":"Медиана −1%","mean":"Средняя −2%","rival":"Конкурент −50 ₽","own":"Скидка от фиксированной базы","fixed":"МВЦ — расходы в рублях","rate":"МВЦ — процентные расходы","margin":"МВЦ — целевая доля дохода","bounds":"Цена в диапазоне","cycle":"Лимиты за цикл и за период","priority":"Приоритет стратегии","round":"Округление до окончания 990","full":"Сквозной расчёт","missing":"Нет подходящих предложений","index":"Индекс цены","custom":"Своя формула"};
const get = id => document.getElementById(id);
const read = id => get(id).valueAsNumber;
const money = new Intl.NumberFormat('ru-RU', {minimumFractionDigits: 0, maximumFractionDigits: 2});
const rub = value => money.format(value) + ' ₽';
const pct = value => money.format(value) + '%';
const defaultOffers = [[5200], [5300], [5400], [4700, 'out'], [4900, 'different']];
const presets = {
  offers: {task: 'Измените статус предложения и проверьте, какие цены попадут в выборку.'},
  analog: {base:'mean', task:'Отметьте неподходящий аналог как несопоставимый и сравните среднюю цену.'},
  min: {base:'min', adjustment:-1, floor:12200, offers:[[12500],[12700],[12850]], task:'Снизьте цену А до 11 900 ₽. Сравните ограничение цены и передачу на проверку.'},
  median: {adjustment:-1, offers:[[4900],[5000],[5100],[5200],[9000]], task:'Переключите медиану на среднее и сравните влияние цены 9 000 ₽.'},
  mean: {base:'mean', adjustment:-2, offers:[[4900],[5100],[4700,'out'],[5300],[5000]]},
  rival: {base:'a', floor:8500, adjustment:-50, unit:'rubles', fallback:true, offers:[[8790],[9100]], task:'Отметьте А как недоступного, затем уберите и Б. Проверьте резервный сценарий.'},
  own: {base:'own', adjustment:-5, task:'Измените текущую цену на 9 500 ₽. При фиксированной базе расчёт по-прежнему даёт 9 500 ₽.'},
  fixed: {cost:5900, income:700, rate:0},
  rate: {},
  margin: {},
  bounds: {base:'min', adjustment:-1, floor:6600, ceiling:7000, offers:[[6500],[6900]], task:'Измените верхний порог на 6 500 ₽ и проверьте конфликт границ.'},
  cycle: {adjustment:-10, cycle:5, period:8, floor:5000, task:'Поднимите МВЦ до 5 600 ₽ и проверьте, что произойдёт при конфликте с лимитом за цикл.'},
  priority: {priority:true, task:'Снимите отметку индивидуального правила и сравните цену от конкурента А с медианой категории.'},
  round: {base:'a', floor:4000, rounding:'down990', policy:'review', offers:[[4012]], task:'Проверьте, почему округление до 3 990 ₽ требует проверки. Затем выберите допустимую цену.'},
  full: {adjustment:-1, floor:5000, ceiling:5600, cycle:5, rounding:'nearest', task:'Проверьте путь от отбора предложений до цены 5 250 ₽ и сравните доход до и после.'},
  missing: {offers:[[5200,'out'],[5300,'unknown'],[5400,'different']], task:'Сделайте предложение А доступным и сравните результат.'},
  index: {adjustment:-1, floor:5000, ceiling:5600, cycle:5, rounding:'nearest', task:'Смените округление и посмотрите, как изменится индекс цены.'}
};
const defaults = {base:'median', adjustment:0, unit:'percent', floor:0, ceiling:0, cycle:0, period:0, rounding:'none', policy:'clamp', current:5490, basePrice:10000, periodPrice:5490, cost:3200, income:800, rate:20, margin:16, volume:100, fallback:false, priority:false};
const statuses = {ok:'Подходит',out:'Нет в наличии',different:'Несопоставимо',unknown:'Нет данных'};
let mode = 'full';
let source = 'full';
const cents = value => Math.round(value * 100 + 1e-8);
const ceilCents = value => Math.ceil(value * 100 - 1e-8);
const floorCents = value => Math.floor(value * 100 + 1e-8);

function show(caption, amount, steps) {
  get('caption').textContent = caption;
  get('amount').value = amount;
  get('trace').replaceChildren(...steps.map(step => {
    const item = document.createElement('li');
    item.textContent = step;
    return item;
  }));
}
function roundWithin(raw, low, high, rounding) {
  const value = raw / 100;
  if (rounding === 'none') return raw;
  if (rounding === 'nearest') {
    const first = Math.ceil(low / 1000) * 1000;
    const last = Math.floor(high / 1000) * 1000;
    return first <= last ? Math.max(first, Math.min(last, Math.round(value / 10) * 1000)) : null;
  }
  const rounded = (Math.floor((value - 990) / 1000) * 1000 + 990) * 100;
  return rounded >= low && rounded <= high ? rounded : null;
}
function calculate() {
  const costMode = ['fixed','rate','margin'].includes(mode);
  const econMode = costMode || ['full','index'].includes(mode);
  const stop = (reason, steps = []) => show('Передать на проверку','—',[...steps, reason]);
  const visibleInputs = Array.from(get('editor').querySelectorAll('input')).filter(input => !input.closest('[hidden]'));
  if (visibleInputs.some(input => !input.validity.valid)) return stop('Проверьте значения в полях.');
  const cost = read('cost'), income = read('income'), rate = read('rate') / 100;
  if (costMode) {
    const divisor = mode === 'fixed' ? 1 : 1 - rate - (mode === 'margin' ? read('margin') / 100 : 0);
    if (divisor <= 0) return stop('Знаменатель должен быть больше нуля. Проверьте процент расходов и целевую долю.');
    const numerator = cost + (mode === 'margin' ? 0 : income);
    return show('Минимально возможная цена', rub(ceilCents(numerator / divisor) / 100), [
      rub(numerator) + ' ÷ ' + money.format(divisor),
      'Нижний порог округляется вверх до копейки.'
    ]);
  }
  const strategy = get('priority').checked ? 'a' : get('base').value;
  const offers = Array.from(get('offers').querySelectorAll('.offer'), row => ({
    name: row.dataset.name, price: row.querySelector('input').valueAsNumber, status: row.querySelector('select').value
  }));
  const eligible = offers.filter(offer => offer.status === 'ok');
  const steps = offers.filter(offer => offer.status !== 'ok').map(offer => offer.name + ' исключён. ' + statuses[offer.status] + '.');
  let base = read('basePrice');
  if (strategy !== 'own') {
    if (!eligible.length) return stop('Подходящих предложений нет. Автоматическая переоценка остановлена.', steps);
    const prices = eligible.map(offer => offer.price).sort((a,b) => a-b);
    if (strategy === 'min') base = prices[0];
    if (strategy === 'mean') base = prices.reduce((sum, price) => sum + price, 0) / prices.length;
    if (strategy === 'median') base = (prices[Math.floor((prices.length - 1) / 2)] + prices[Math.floor(prices.length / 2)]) / 2;
    if (strategy === 'a') {
      const rival = eligible.find(offer => offer.name === 'А') || (get('fallback').checked && eligible.find(offer => offer.name === 'Б'));
      if (!rival) return stop('У выбранного конкурента и разрешённого резерва нет подходящего предложения.', steps);
      base = rival.price;
      steps.push((get('priority').checked ? 'Индивидуальный ориентир. ' : '') + 'Использован конкурент ' + rival.name + '.');
    } else steps.push('В расчёте предложения ' + eligible.map(offer => offer.name).join(', ') + '.');
  }
  const adjustment = read('adjustment');
  const isPercent = get('unit').value === 'percent';
  if (isPercent && adjustment < -100) return stop('Процент снижения больше 100%.', steps);
  const raw = cents(base + (isPercent ? base * adjustment / 100 : adjustment));
  steps.push('Ориентир ' + rub(base) + '. После поправки ' + rub(raw / 100) + '.');
  const current = read('current');
  let low = ceilCents(read('floor'));
  let high = read('ceiling') ? floorCents(read('ceiling')) : Infinity;
  for (const [label, anchor, limit] of [['За цикл', current, read('cycle')], ['За период', read('periodPrice'), read('period')]]) {
    if (!limit) continue;
    const min = ceilCents(anchor * (1 - limit / 100));
    const max = floorCents(anchor * (1 + limit / 100));
    low = Math.max(low, min);
    high = Math.min(high, max);
    steps.push(label + ' допустим диапазон ' + rub(min / 100) + ' – ' + rub(max / 100) + '.');
  }
  if (low > high) return stop('Границы конфликтуют. Допустимой цены нет.', steps);
  const review = get('policy').value === 'review';
  if (review && (raw < low || raw > high)) return stop('Расчётная цена выходит за допустимые границы.', steps);
  const limited = Math.max(low, Math.min(high, raw));
  if (limited !== raw) steps.push('После применения ограничений ' + rub(limited / 100) + '.');
  const rounding = get('rounding').value;
  const attempted = rounding === 'down990' ? (Math.floor((limited / 100 - 990) / 1000) * 1000 + 990) * 100
    : rounding === 'nearest' ? Math.round(limited / 1000) * 1000 : limited;
  if (rounding !== 'none') steps.push('После выбранного округления ' + rub(attempted / 100) + '.');
  const permitted = roundWithin(limited, low, high, rounding);
  if (permitted === null && (review || rounding !== 'down990')) return stop('Нет цены с выбранным направлением округления и в допустимых границах.', steps);
  if (review && (attempted < low || attempted > high)) return stop('Округление нарушило ограничение.', steps);
  const price = (permitted ?? limited) / 100;
  if ((permitted ?? limited) !== attempted) steps.push('Выбрано допустимое значение ' + rub(price) + '.');
  steps.push('Индекс цены ' + pct(price / base * 100) + '.');
  if (econMode) {
    const before = current * (1 - rate) - cost;
    const after = price * (1 - rate) - cost;
    steps.push('Доход на единицу после указанных расходов: ' + rub(before) + ' → ' + rub(after) + '.');
    steps.push('Минимальный доход ' + rub(income) + (after + 1e-8 >= income ? ' достигнут.' : ' не достигнут.'));
    if (after > 0 && before > 0) steps.push('Чтобы сохранить суммарный доход, потребуется ' + Math.ceil(before * read('volume') / after - 1e-8) + ' шт. Изменение расчётного объёма ' + pct((before / after - 1) * 100) + '.');
  }
  show('Рекомендованная цена', rub(price), steps);
}
function openLesson(id) {
  mode = id;
  get('lesson').value = id;
  if (id !== 'custom') {
    source = id;
    const preset = presets[id];
    for (const [key, value] of Object.entries(defaults)) {
      const field = get(key);
      if (field.type === 'checkbox') field.checked = preset[key] ?? value;
      else field.value = preset[key] ?? value;
    }
    get('offers').innerHTML = (preset.offers || defaultOffers).map(([price,status='ok'],index) => {
      const name = ['А','Б','В','Г','Д'][index];
      return '<div class="offer" data-name="' + name + '"><label>' + (id === 'analog' ? 'Аналог ' : 'Конкурент ') + name +
        ', ₽<input type="number" min=".01" step="any" value="' + price + '" required></label><label>Статус<select>' +
        Object.entries(statuses).map(([key,value]) => '<option value="' + key + '"' + (key === status ? ' selected' : '') + '>' + value + '</option>').join('') +
        '</select></label></div>';
    }).join('');
  }
  const costMode = ['fixed','rate','margin'].includes(id);
  get('data').hidden = costMode;
  get('rule').hidden = costMode;
  get('economics').hidden = !costMode && !['full','index'].includes(id);
  get('rate').parentElement.hidden = id === 'fixed';
  get('income').parentElement.hidden = id === 'margin';
  get('margin').parentElement.hidden = id !== 'margin';
  get('volume').parentElement.hidden = costMode;
  get('back').href = 'priceva-repricing-article.html#' + anchors[source];
  get('task').textContent = presets[id]?.task || (id === 'custom' ? 'Измените параметры и проверьте свою формулу.' : labels[id] + '. Измените данные и сравните расчёт.');
  calculate();
}
function followHash() {
  const id = location.hash.slice(10);
  if (!location.hash.startsWith('#practice-') || !Object.hasOwn(labels,id)) return;
  if (mode !== id) openLesson(id);
  get('practice').focus({preventScroll:true});
  get('practice').scrollIntoView({block:'start'});
}
get('lesson').addEventListener('change', event => {location.hash = 'practice-' + event.target.value;});
get('editor').addEventListener('input',calculate);
get('editor').addEventListener('submit',event => event.preventDefault());
window.addEventListener('hashchange',followHash);
openLesson('full');
followHash();
</script></html>
